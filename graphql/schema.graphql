"A datetime string with format `Y-m-d H:i:s`, e.g. `2018-05-23 13:43:32`."
scalar DateTime @scalar(class: "Nuwave\\Lighthouse\\Schema\\Types\\Scalars\\DateTime")

"Indicates what fields are available at the top level of a query operation."
type Query {
    "Find a single user by an identifying attribute."
    user(
      "Search by primary key."
      id: ID @eq @rules(apply: ["prohibits:email", "required_without:email"])

      "Search by email address."
      email: String @eq @rules(apply: ["prohibits:id", "required_without:id", "email"])
    ): User @find

    "List multiple users."
    users(
      "Filters by name. Accepts SQL LIKE wildcards `%` and `_`."
      name: String @where(operator: "like")
    ): [User!]! @paginate(defaultCount: 10)
}

"Account of a person who uses this application."
type User {
    "Unique primary key."
    id: ID!

    "Non-unique name."
    name: String!

    "Unique email address."
    email: String!

    "When the email was verified."
    email_verified_at: DateTime

    "When the account was created."
    created_at: DateTime!

    "When the account was last updated."
    updated_at: DateTime!
}

type Event {
    id: ID!
    title: String!
    registrations: [Registration!]! @hasMany
}

type Registration {
    id: ID!
    user_id: ID!
    event_id: ID!
    datetime: DateTime!
    deleted_at: DateTime
    user: User! @belongsTo
    event: Event! @belongsTo
}

type Mutation {
    createUser(name: String!, email: String!, password: String!): User! @create
    updateUser(id: ID! @eq, name: String, email: String): User! @update
    deleteUser(id: ID! @eq): User! @delete

    createEvent(title: String!): Event! @create
    updateEvent(id: ID! @eq, title: String): Event! @update
    deleteEvent(id: ID! @eq): Event! @delete

    deleteRegistration(id: ID! @eq): Registration @delete
    restoreRegistration(id: ID!): Registration
        @field(resolver: "App\\GraphQL\\Mutations\\RegistrationMutation@restore")
    forceDeleteRegistration(id: ID!): Registration
        @field(resolver: "App\\GraphQL\\Mutations\\RegistrationMutation@forceDelete")
}
